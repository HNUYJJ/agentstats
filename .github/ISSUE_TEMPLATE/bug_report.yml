name: Bug report
description: Something is broken, or the numbers look wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: |
        Include the exact command you ran and its output. If costs look wrong,
        also paste the output of `agentstats doctor`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentstats version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: Windows 11, Node 22.10
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Never paste transcript contents - they are not needed and may contain private data.
